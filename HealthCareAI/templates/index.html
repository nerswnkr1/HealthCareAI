<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthCare Assistant</title>
<style>
  :root {
    --green: #1a9c6b;
    --green-dark: #158056;
    --text-dark: #1f2937;
    --text-gray: #6b7280;
    --border: #e5e7eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 20px;
    height: 20px;
    stroke: #ffffff;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-dark);
  }

  .logo-text span {
    color: var(--green);
  }

  nav {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  nav a {
    text-decoration: none;
    color: var(--text-dark);
    font-size: 15px;
  }

  .login-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .login-btn svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
  }

  /* Main content */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
  }

  .hero-icon {
    width: 80px;
    height: 80px;
    border: 2px solid #b9e3ce;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .hero-icon svg {
    width: 36px;
    height: 36px;
    stroke: var(--green);
  }

  h1 {
    font-size: 40px;
    font-weight: 700;
    color: var(--text-dark);
  }

  h1 span {
    color: var(--green);
  }

  .subtitle {
    margin-top: 14px;
    color: var(--text-gray);
    font-size: 16px;
    line-height: 1.6;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 620px;
    margin-top: 36px;
    padding: 10px 12px 10px 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }

  .search-box svg {
    width: 20px;
    height: 20px;
    stroke: var(--text-gray);
    flex-shrink: 0;
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    color: var(--text-dark);
    background: transparent;
  }

  .search-box input::placeholder {
    color: #9ca3af;
  }

  .send-btn {
    width: 42px;
    height: 42px;
    background: var(--green);
    border: none;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .send-btn svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
    fill: none;
  }

  .try-asking {
    margin-top: 40px;
    color: var(--text-gray);
    font-size: 14px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    max-width: 800px;
  }

  .suggestion-chip {
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    color: var(--text-dark);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .suggestion-chip:hover {
    border-color: var(--green);
    background: #f2fbf6;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #9ca3af;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    header {
      padding: 14px 20px;
    }
    nav {
      display: none;
    }
    h1 {
      font-size: 28px;
    }
    .search-box {
      padding: 8px 8px 8px 16px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>
    <div class="logo-text">HealthCare <span style="color:var(--text-dark)">Assistant</span></div>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Hospitals</a>
    <a href="#">Pharmacies</a>
    <a href="#">About</a>
  </nav>

  <button class="login-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    Login
  </button>
</header>

<main>
  <div class="hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </div>

  <h1>How can I help <span>you</span> today?</h1>
  <p class="subtitle">
    Find and compare hospitals and pharmacies near you.<br>
    Get information about facilities, fees, and more.
  </p>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="Ask me anything...">
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <p class="try-asking">Try asking:</p>
  <div class="suggestions">
    <button class="suggestion-chip">Find hospitals near me</button>
    <button class="suggestion-chip">Find pharmacies near me</button>
    <button class="suggestion-chip">Hospitals with ICU</button>
    <button class="suggestion-chip">Compare hospitals</button>
    <button class="suggestion-chip">Emergency services</button>
  </div>
</main>

<footer>&copy; 2026 HealthCare Assistant. All rights reserved.</footer>

<script>
  const searchInput = document.getElementById('searchInput');
  const sendBtn = document.getElementById('sendBtn');
  const chips = document.querySelectorAll('.suggestion-chip');

  function handleSend() {
    const query = searchInput.value.trim();
    if (query) {
      alert('You asked: "' + query + '"');
      searchInput.value = '';
    }
  }

  sendBtn.addEventListener('click', handleSend);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleSend();
  });

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      searchInput.value = chip.textContent;
      searchInput.focus();
    });
  });
</script>

</body>
</html>
